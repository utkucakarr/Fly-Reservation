services:
  postgres:
    image: postgres:17
    container_name: flyreservation-postgres
    environment:
      POSTGRES_USER: flyuser
      POSTGRES_PASSWORD: flypass
      POSTGRES_DB: flyreservation
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  seq:
    image: datalust/seq:2026.1
    container_name: flyreservation-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:5343:80"
    volumes:
      - seqdata:/data

volumes:
  pgdata:
  seqdata: